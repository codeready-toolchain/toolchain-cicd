name: 'Release Toolchain Operator'
description: 'An action that releases a new version of a Toolchain Operator'
inputs:
  quay-token:
    description: Quay robot password
    required: true
  quay-username:
    description: Quay robot username
    required: false
    default: codeready-toolchain+push
  quay-namespace:
    description: Quay namespace
    required: false
    default: codeready-toolchain
runs:
  using: "composite"
  steps:
  - name: Login to quay
    shell: bash
    env:
      QUAY_TOKEN: ${{ inputs.quay-token }}
      QUAY_USERNAME: ${{ inputs.quay-username }}
    run: |
      set -e
      export XDG_RUNTIME_DIR=/run/user/${UID}
      mkdir -p ${XDG_RUNTIME_DIR}/containers || true

      QUAY_AUTH=$(printf '%s:%s' "${QUAY_USERNAME}" "${QUAY_TOKEN}" | base64 -w 0)

      echo "{
                    \"auths\": {
                            \"quay.io\": {
                                    \"auth\": \"${QUAY_AUTH}\"
                            }
                    }
            }"> ${XDG_RUNTIME_DIR}/containers/auth.json

      podman login --get-login quay.io

  - name: Build & push
    shell: bash
    run: |
      set -ex
      make podman-push QUAY_NAMESPACE=${{ inputs.quay-namespace }}

  - name: generate manifests
    shell: bash
    run: |
      set -ex

      make generate-cd-release-manifests QUAY_NAMESPACE=${{ inputs.quay-namespace }}

      make push-bundle-and-index-image QUAY_NAMESPACE=${{ inputs.quay-namespace }} IMAGE_BUILDER=podman
