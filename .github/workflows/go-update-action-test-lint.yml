name: Test and Lint 'go-update-action'
on:
  pull_request:
    branches:
    - master
    paths:
    - 'go-update-action/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go-update-action/go.mod

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles ('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Test
      working-directory: go-update-action
      run: |
        make test

  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go-update-action/go.mod

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0
        working-directory: go-update-action
        args: --path-mode=abs --config=.golangci.yml --verbose ./...
