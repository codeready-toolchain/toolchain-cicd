name: 'Go Version Updater'
description: 'Check for Go version updates and open PRs to bump go.mod, Dockerfiles, Containerfiles, and workflow files'

inputs:
  type:
    description: 'Update type: patch or minor'
    required: true
  token:
    description: 'GitHub token (GitHub App token recommended to trigger downstream workflows)'
    required: true
  go-version-file:
    description: 'Path to go.mod file for current version detection'
    required: false
    default: 'go.mod'
  paths:
    description: 'Directories to scan for files to update (newline-separated)'
    required: false
    default: '.'
  labels:
    description: 'Labels to apply to PRs (newline-separated)'
    required: false
    default: 'go-update'
  exclude:
    description: 'Glob patterns to exclude files from updates (newline-separated)'
    required: false
    default: ''

outputs:
  pr-url:
    description: 'URL of the created PR (empty if skipped)'
  action-taken:
    description: 'Action taken: created, skipped, or replaced'

runs:
  # the container runs with the caller's workspace mounted at /github/workspace as its working directory,
  # so relative paths (go.mod, scanned dirs, `go mod tidy`) target the caller's repo
  using: 'docker'
  # the image tag is the short SHA of the commit the image was built from.
  # It is updated by a PR opened by the 'Publish go-update-action' workflow after each image push.
  image: 'docker://quay.io/codeready-toolchain/go-update-action:afecc44'
  args:
    - --type=${{ inputs.type }}
    - --token=${{ inputs.token }}
    - --go-version-file=${{ inputs.go-version-file }}
    - --paths=${{ inputs.paths }}
    - --labels=${{ inputs.labels }}
    - --exclude=${{ inputs.exclude }}
    - --owner=${{ github.repository_owner }}
    - --repo=${{ github.event.repository.name }}
