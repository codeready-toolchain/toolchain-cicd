name: 'Publish Current Toolchain Operators (Host & Member)'
description: 'An action that publishes the current version of Toolchain Operators as single releases'
inputs:
  quay-token:
    description: Quay token
    required: false
  quay-namespace:
    description: Quay namespace
    required: false
    default: codeready-toolchain
  sha:
    description: PR head sha
    default: ${{ github.event.pull_request.head.sha }}
    required: false
  pr-number:
    description: Number of the PR
    default: ${{ github.event.pull_request.number }}
    required: false
  author:
    description: Author of the PR
    default: ${{ github.event.pull_request.head.user.login }}
    required: false
  gh-head-ref:
    description: Branch name the PR was opened from
    default: ${{ github.event.pull_request.head.ref }}
    required: false
  build-only:
    description: Build and save images without logging in or pushing
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
  - name: Login to quay
    if: ${{ inputs.build-only != 'true' }}
    shell: bash
    run: |
      set -e
      export XDG_RUNTIME_DIR=/run/user/${UID}
      mkdir -p ${XDG_RUNTIME_DIR}/containers || true
      echo "{
                    \"auths\": {
                            \"quay.io\": {
                                    \"auth\": \"${{ inputs.quay-token }}\"
                            }
                    }
            }"> ${XDG_RUNTIME_DIR}/containers/auth.json

      podman login --get-login quay.io

  - name: Publish current bundle for e2e tests
    shell: bash
    run: |
      set -euo pipefail
      PROVIDED_REF=${{ inputs.gh-head-ref }}
      if [[ -n ${PROVIDED_REF} ]]; then
        GH_HEAD_REF_PARAM="GITHUB_HEAD_REF=${PROVIDED_REF}"
      fi
      if [[ "${{ inputs.build-only }}" == "true" ]]; then
        REAL_PODMAN=$(command -v podman)
        LIST_DIR="${GITHUB_WORKSPACE}/e2e-images"
        rm -rf "${LIST_DIR}"
        mkdir -p "${LIST_DIR}"
        WRAP_DIR=$(mktemp -d)
        cat > "${WRAP_DIR}/podman" << EOF
      #!/usr/bin/env bash
      set -euo pipefail
      real="${REAL_PODMAN}"
      list="${LIST_DIR}/images.txt"
      cmd="\${1:-}"
      shift || true
      if [[ "\${cmd}" == "push" ]]; then
        image="\${@: -1}"
        if [[ -n "\${image}" ]]; then
          printf '%s\n' "\${image}" >> "\${list}"
        fi
        exit 0
      fi
      if [[ "\${cmd}" == "pull" ]]; then
        image="\${@: -1}"
        if [[ -n "\${image}" ]] && "\${real}" image exists "\${image}"; then
          "\${real}" image inspect --format '{{.Id}}' "\${image}"
          exit 0
        fi
      fi
      exec "\${real}" "\${cmd}" "\$@"
      EOF
        chmod +x "${WRAP_DIR}/podman"
        export PATH="${WRAP_DIR}:${PATH}"
      fi
      make publish-current-bundles-for-e2e QUAY_NAMESPACE=${{ inputs.quay-namespace }} IMAGE_BUILDER=podman PULL_PULL_SHA=${{ inputs.sha }} PULL_NUMBER=${{ inputs.pr-number }} AUTHOR=${{ inputs.author }} ${GH_HEAD_REF_PARAM:-}
      if [[ "${{ inputs.build-only }}" == "true" ]]; then
        list="${GITHUB_WORKSPACE}/e2e-images/images.txt"
        if [[ ! -s "${list}" ]]; then
          echo "no images were recorded for the e2e archive" >&2
          exit 1
        fi
        mapfile -t images < <(awk 'NF && !seen[$0]++' "${list}")
        podman save --multi-image-archive -o "${GITHUB_WORKSPACE}/e2e-images/e2e-images.tar" "${images[@]}"
      fi
